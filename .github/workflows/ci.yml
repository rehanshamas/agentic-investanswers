name: CI
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  check:
    name: CI
    runs-on: ubuntu-latest
    services:
      # S3 stand-in, so the storage integration tests run here instead of skipping.
      minio:
        image: bitnamilegacy/minio:2025.7.23-debian-12-r5
        env:
          MINIO_ROOT_USER: minio
          MINIO_ROOT_PASSWORD: minio12345
        ports: ["9000:9000"]
      # Redis for the recent-bars cache tests (M2-02), which otherwise skip.
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 2s --health-retries 15
    env:
      AIA_S3_ENDPOINT: http://127.0.0.1:9000
      AIA_REDIS_TEST_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Wait for MinIO
        run: for i in $(seq 1 30); do curl -sf http://127.0.0.1:9000/minio/health/live && exit 0; sleep 2; done; exit 1
      - name: Lint, test, typecheck (affected)
        run: |
          BASE=${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD~1' }}
          pnpm nx affected -t lint test typecheck --base=$BASE --head=HEAD --output-style=static
        env:
          NX_DAEMON: "false"

  fixtures-guard:
    name: Fixtures guard
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fail if fixtures/ changed without the fixtures-approved label
        env:
          APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'fixtures-approved') }}
        run: |
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- fixtures/ | grep -v '\.gitkeep$' || true)
          if [ -n "$CHANGED" ] && [ "$APPROVED" != "true" ]; then
            echo "These fixture files changed:"; echo "$CHANGED"
            echo "Parity fixtures are the spec. Sham must review them and add the 'fixtures-approved' label."
            exit 1
          fi
