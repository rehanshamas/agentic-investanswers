<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>InvestAnswers Charts</title>
    <style>
      html, body, #root { height: 100%; margin: 0; }
      body { font: 14px/1.4 system-ui, sans-serif; background: #fff; color: #1f2328; }
      .app { display: flex; flex-direction: column; height: 100%; }
      .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 16px; border-bottom: 1px solid #e5e7eb; }
      .toolbar select, .toolbar button { font: inherit; padding: 4px 8px; border: 1px solid #d0d7de; border-radius: 4px; background: #fff; color: inherit; cursor: pointer; }
      .timeframes { display: flex; flex-wrap: wrap; gap: 4px; }
      .toolbar button[aria-pressed='true'] { background: #1f2328; color: #fff; border-color: #1f2328; }
      .toolbar button:disabled { opacity: 0.4; cursor: not-allowed; }
      .chart { flex: 1; min-height: 0; }
      .status { display: flex; gap: 12px; padding: 4px 16px; border-top: 1px solid #e5e7eb; font-size: 12px; color: #57606a; }
      .message { padding: 16px; }
      .overlay { position: fixed; inset: 0; z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(31, 35, 40, 0.35); }
      .settings { width: 100%; max-width: 360px; max-height: 100%; overflow: auto; padding: 16px; border-radius: 8px; background: #fff; box-shadow: 0 8px 24px rgba(31, 35, 40, 0.2); }
      .settings h2 { margin: 0 0 12px; font-size: 16px; }
      .settings .field { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; align-items: center; margin-bottom: 12px; }
      .settings .field small { grid-column: 1 / -1; color: #57606a; }
      .settings input, .settings select, .settings button { font: inherit; padding: 4px 8px; border: 1px solid #d0d7de; border-radius: 4px; background: #fff; color: inherit; }
      .settings input[type='number'] { width: 96px; }
      .settings .field[data-invalid] input, .settings .field[data-invalid] select { border-color: #cf222e; }
      .settings .error { color: #cf222e; }
      .settings .actions { display: flex; gap: 8px; margin-top: 16px; }
      .settings .actions span { flex: 1; }
      .settings button[type='submit'] { background: #1f2328; color: #fff; border-color: #1f2328; cursor: pointer; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
